services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  server:
    build:
      context: ../mern-demo/server
      dockerfile: Dockerfile
    env_file:
      - ../mern-demo/server/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/studentdb
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - mongo

  client:
    build:
      context: ../mern-demo/client
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://localhost:5000
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  mongo-data:
